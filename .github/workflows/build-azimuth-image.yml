# .github/workflows/build-azimuth-image.yml
#
# Automatically builds and pushes the downstream Azimuth Docker image to
# Docker Hub whenever any of the files that form the image are changed
# on the main branch.
#
# Image URI: docker.io/majidfarhadloo/scrna_processing_azimuth:{tag}
#
# Tags applied on each build:
#   - The git tag (e.g. v1.2) if the push is a tagged release
#   - The short git SHA (e.g. sha-a3f2c1b) for every push
#   - "latest" for every push to main
#
# Requires two GitHub Actions repository secrets:
#   DOCKERHUB_USERNAME  – Docker Hub username (majidfarhadloo)
#   DOCKERHUB_TOKEN     – Docker Hub Personal Access Token (read/write scope)

name: Build and Push Azimuth Docker Image

on:
  push:
    branches:
      - main
      - dev
    # Only trigger when files that affect the image actually change
    paths:
      - "terra_wdl/Dockerfile.azimuth"
      - "terra_wdl/hybrid_azimuth_task.R"
      - "terra_wdl/prep_azimuth_references.R"

  # Allow manual triggering from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional image version tag (e.g. 1.1). Defaults to short SHA."
        required: false
        default: ""

env:
  REGISTRY: docker.io
  IMAGE_NAME: majidfarhadloo/scrna_processing_azimuth

jobs:
  build-and-push:
    name: Build and push Azimuth image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          TAGS="${BASE}:sha-${SHORT_SHA},${BASE}:latest"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            GIT_TAG="${{ github.ref_name }}"
            TAGS="${TAGS},${BASE}:${GIT_TAG}"
            echo "Building release tag: ${GIT_TAG}"
          fi

          MANUAL_TAG="${{ github.event.inputs.tag }}"
          if [[ -n "${MANUAL_TAG}" ]]; then
            TAGS="${TAGS},${BASE}:${MANUAL_TAG}"
            echo "Building manual tag: ${MANUAL_TAG}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Final tags: ${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Azimuth image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: terra_wdl/Dockerfile.azimuth
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Image build summary
        run: |
          echo "### Azimuth image pushed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next step:** In Terra's downstream.wdl input form, set \`azimuth_docker\` to:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Image is public on Docker Hub — no further visibility changes required." >> $GITHUB_STEP_SUMMARY
